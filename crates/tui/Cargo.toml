[package]
name = "nexus-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
# `version` is required for `cargo publish` (path-only deps can't be
# rewritten for the registry). The caret `0.1` always resolves to the
# just-published nexus-chat-core release — both packages ride the same
# workspace version.
nexus-chat-core = { path = "../core", version = "0.1" }
anyhow = { workspace = true }
arboard = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
open = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
textwrap = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tui-markdown = { workspace = true }
tui-textarea-2 = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
nexus-chat-core = { path = "../core", version = "0.1", features = ["test-helpers"] }

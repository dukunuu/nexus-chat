<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nexus studio</title>
  <link rel="stylesheet" href="/studio.css">
  <link rel="stylesheet" href="/doc/doc.css">
  <link rel="stylesheet" href="/library.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">nexus <span>studio</span></div><button id="open-library" class="library-button" data-icon="library" aria-label="Library" title="Library (⌘/Ctrl+O)">Library</button><span class="divider"></span>
    <div class="deck-menu"><button id="deck-title" aria-label="Project menu" aria-haspopup="true" aria-expanded="false"><span id="deck-title-label">Untitled</span><span data-icon="chevron"></span></button><div id="deck-menu" class="popover" hidden><button id="rename-deck">Rename</button><button id="new-deck">New deck</button><button id="new-doc">New doc</button><button id="open-deck">Open…</button><button id="save-copy">Save a copy…</button></div></div>
    <span id="save" class="save-state" title="Every change is saved to the deck file as you make it"><span id="dirty">Opening…</span></span>
    <span class="spacer"></span>
    <span id="link-status" class="link-pill">not linked</span>
    <button id="toggle-comments" data-icon="comment">Comments <span id="comment-count" class="count">0</span></button>
    <span class="divider"></span><button id="undo" class="icon-button" data-icon="undo" aria-label="Undo" title="Undo (⌘/Ctrl+Z)"></button><button id="redo" class="icon-button" data-icon="redo" aria-label="Redo" title="Redo (⇧⌘/Ctrl+Z)"></button>
    <div class="template-menu"><button id="deck-design" aria-haspopup="dialog" aria-expanded="false">Design</button><div id="deck-design-pop" class="popover" role="dialog" aria-label="Design" hidden><div id="deck-design-info"></div><div id="deck-design-list"></div><button id="add-template">Add template…</button></div></div>
    <button id="present" data-icon="play">Present</button><div class="export-menu"><button id="export" class="primary" data-icon="export" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export</button><div id="export-menu" class="popover" role="menu" aria-label="Export format" hidden><button role="menuitem" tabindex="-1" data-format="pptx">PowerPoint (.pptx)</button><button role="menuitem" tabindex="-1" data-format="pdf">PDF</button><button role="menuitem" tabindex="-1" data-format="png">PNG images (.zip)</button><button role="menuitem" tabindex="-1" data-format="html">HTML presentation</button><button role="menuitem" tabindex="-1" data-format="json">Deck JSON</button><button role="menuitemcheckbox" tabindex="-1" id="export-template" aria-checked="false">Into template</button><button role="menuitemcheckbox" tabindex="-1" id="export-quick" aria-checked="false">Save to exports/ without asking</button></div></div>
  </header>
  <main>
    <section id="workspace">
      <aside id="strip-pane"><div id="slides-pane"><div class="rail-heading">Slides</div><div id="strip"></div><button id="add-slide" class="add-slide" data-icon="plus" title="Add a slide" aria-label="Add a slide"></button><div id="layout-menu" class="popover" hidden><div class="eyebrow">Start with a layout</div><div id="layout-options"></div></div></div><div class="layers-heading"><span data-icon="layers"></span>Layers</div><div id="layers" class="layers-tree" role="tree" aria-label="Layers"></div></aside>
      <section id="canvas-space">
        <nav id="canvas-heading"><span id="slide-label">Your canvas</span><span class="spacer"></span><div class="insert-menu"><button id="insert-toggle" data-icon="plus">Insert</button><div id="insert-options" class="popover" hidden><button id="add-text">Text</button><button id="add-shape">Shape</button><button id="add-image">Image</button></div></div><button id="play-from-here" title="Play from here (Shift+Enter)" data-icon="play">Play from here</button><button id="toggle-properties" class="icon-button" data-icon="layers" title="Properties (⌘/Ctrl+\)" aria-label="Toggle properties"></button></nav>
        <div id="preview-bar" hidden><span class="preview-dot"></span><strong>Suggested edit</strong><button id="preview-toggle">After · B for before</button><span class="spacer"></span><button id="preview-apply" class="primary">Apply edit</button><button id="close-preview" class="icon-button" data-icon="x" aria-label="Close preview"></button></div>
        <div id="stage"><div id="slide-wrap"><div id="canvas" class="slide" tabindex="0" aria-label="Slide canvas"></div><div id="pins"></div><div id="build-badges"></div></div><div id="floating-toolbar" role="toolbar" aria-label="Selection formatting" hidden></div><div id="canvas-empty" hidden><h2>A blank canvas. A fresh start.</h2><p>Add a slide to begin your story.</p><button id="empty-add" data-icon="plus">Add slide</button></div></div>
        <div id="canvas-bottom"><details id="notes"><summary>Speaker notes</summary><textarea id="speaker-notes" aria-label="Speaker notes" placeholder="What would you like to say about this slide?"></textarea></details><div class="canvas-controls"><div class="mode-switch"><button id="edit-mode" data-icon="cursor" aria-pressed="true">Edit</button><button id="comment-mode" data-icon="comment" aria-pressed="false">Comment <kbd>C</kbd></button></div><span class="spacer"></span><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" title="Fit (⌘/Ctrl+0)">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
        <div id="thread-popover" class="thread-popover" hidden></div><div id="status" role="status" hidden></div>
      </section>
      <aside id="properties-panel" class="side-panel" hidden><div class="side-heading"><div class="panel-tabs" role="tablist" aria-label="Properties"><button id="tab-design" role="tab" aria-selected="true">Design</button><button id="tab-animate" role="tab" aria-selected="false">Animate</button></div><button id="close-properties" class="icon-button" data-icon="x" aria-label="Close properties"></button></div><div id="properties"></div></aside>
      <aside id="comments-panel" class="side-panel" hidden><div class="side-heading"><strong>Comments <span id="review-count" class="count"></span></strong><button id="close-comments" class="icon-button" data-icon="x" aria-label="Close comments"></button></div><div class="comment-filters"><button id="filter-open" aria-pressed="true">Open</button><button id="filter-resolved" aria-pressed="false">Resolved</button></div><label class="resolved-toggle"><input id="show-resolved" type="checkbox"> Show resolved pins</label><div id="comments-list"></div></aside>
    </section>
  </main>
  <div id="library" hidden></div>
  <dialog id="path-dialog"><form method="dialog"><h2 id="path-heading">Open deck</h2><label id="path-label" for="path-input">Path</label><input id="path-input" required autocomplete="off"><p id="path-hint"></p><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button id="path-confirm" class="primary" value="ok">Open</button></div></form></dialog>
  <dialog id="export-details" aria-labelledby="export-details-heading"><h2 id="export-details-heading">Export approximations</h2><ul id="export-warnings"></ul><form method="dialog"><div class="dialog-actions"><button value="close">Close</button></div></form></dialog>
  <div id="doc-app" hidden></div>
  <div id="presentation" hidden><div id="present-stage"></div><aside id="presenter"><div class="presenter-label">Next step</div><div id="present-next"></div><div class="presenter-label">Speaker notes</div><div id="present-notes"></div><div id="present-timer">00:00</div></aside><span id="present-counter"></span><span id="present-jump"></span><span id="present-step"></span><button id="presenter-toggle">Presenter · P</button><button id="exit-present">Exit · Esc</button></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nexus studio</title>
  <link rel="stylesheet" href="/studio.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">nexus <span>studio</span></div><span class="divider"></span>
    <div class="deck-menu"><button id="deck-title" aria-label="Project menu" aria-haspopup="true" aria-expanded="false"><span id="deck-title-label">Untitled</span><span data-icon="chevron"></span></button><div id="deck-menu" class="popover" hidden><button id="rename-deck">Rename</button><button id="new-deck">New deck</button><button id="open-deck">Open…</button></div></div>
    <span id="save" class="save-state" title="Every change is saved to the deck file as you make it"><span id="dirty">Opening…</span></span>
    <span class="spacer"></span>
    <span id="link-status" class="link-pill">not linked</span>
    <button id="toggle-comments" data-icon="comment">Comments <span id="comment-count" class="count">0</span></button>
    <span class="divider"></span><button id="undo" class="icon-button" data-icon="undo" aria-label="Undo" title="Undo (⌘/Ctrl+Z)"></button><button id="redo" class="icon-button" data-icon="redo" aria-label="Redo" title="Redo (⇧⌘/Ctrl+Z)"></button>
    <button id="present" data-icon="play">Present</button><button id="export" class="primary" data-icon="export">Export</button>
  </header>
  <main>
    <section id="workspace">
      <aside id="strip-pane"><div id="slides-pane"><div class="rail-heading">Slides</div><div id="strip"></div><button id="add-slide" class="add-slide" data-icon="plus" title="Add a slide" aria-label="Add a slide"></button><div id="layout-menu" class="popover" hidden><div class="eyebrow">Start with a layout</div><div id="layout-options"></div></div></div><div class="layers-heading"><span data-icon="layers"></span>Layers</div><div id="layers" class="layers-tree" role="tree" aria-label="Layers"></div></aside>
      <section id="canvas-space">
        <nav id="canvas-heading"><span id="slide-label">Your canvas</span><span class="spacer"></span><div class="insert-menu"><button id="insert-toggle" data-icon="plus">Insert</button><div id="insert-options" class="popover" hidden><button id="add-text">Text</button><button id="add-shape">Shape</button><button id="add-image">Image</button></div></div><button id="toggle-properties" class="icon-button" data-icon="layers" title="Properties (⌘/Ctrl+\)" aria-label="Toggle properties"></button></nav>
        <div id="preview-bar" hidden><span class="preview-dot"></span><strong>Suggested edit</strong><button id="preview-toggle">After · B for before</button><span class="spacer"></span><button id="preview-apply" class="primary">Apply edit</button><button id="close-preview" class="icon-button" data-icon="x" aria-label="Close preview"></button></div>
        <div id="stage"><div id="slide-wrap"><div id="canvas" class="slide" tabindex="0" aria-label="Slide canvas"></div><div id="pins"></div><div id="floating-toolbar" hidden></div></div><div id="canvas-empty" hidden><h2>A blank canvas. A fresh start.</h2><p>Add a slide to begin your story.</p><button id="empty-add" data-icon="plus">Add slide</button></div></div>
        <div id="canvas-bottom"><details id="notes"><summary>Speaker notes</summary><textarea id="speaker-notes" aria-label="Speaker notes" placeholder="What would you like to say about this slide?"></textarea></details><div class="canvas-controls"><div class="mode-switch"><button id="edit-mode" data-icon="cursor" aria-pressed="true">Edit</button><button id="comment-mode" data-icon="comment" aria-pressed="false">Comment <kbd>C</kbd></button></div><span class="spacer"></span><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" title="Fit (⌘/Ctrl+0)">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
        <div id="thread-popover" class="thread-popover" hidden></div><div id="status" role="status" hidden></div>
      </section>
      <aside id="properties-panel" class="side-panel" hidden><div class="side-heading"><strong>Design</strong><button id="close-properties" class="icon-button" data-icon="x" aria-label="Close properties"></button></div><div id="properties"></div></aside>
      <aside id="comments-panel" class="side-panel" hidden><div class="side-heading"><strong>Comments <span id="review-count" class="count"></span></strong><button id="close-comments" class="icon-button" data-icon="x" aria-label="Close comments"></button></div><div class="comment-filters"><button id="filter-open" aria-pressed="true">Open</button><button id="filter-resolved" aria-pressed="false">Resolved</button></div><label class="resolved-toggle"><input id="show-resolved" type="checkbox"> Show resolved pins</label><div id="comments-list"></div></aside>
    </section>
  </main>
  <dialog id="path-dialog"><form method="dialog"><h2 id="path-heading">Open deck</h2><label id="path-label" for="path-input">Path</label><input id="path-input" required autocomplete="off"><p id="path-hint"></p><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button id="path-confirm" class="primary" value="ok">Open</button></div></form></dialog>
  <div id="presentation" hidden><div id="present-slide" class="slide"></div><span id="present-counter"></span><button id="exit-present">Exit · Esc</button></div>
</body>
</html>

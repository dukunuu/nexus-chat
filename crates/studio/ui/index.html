<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nexus studio</title>
  <link rel="stylesheet" href="/studio.css">
  <link rel="stylesheet" href="/doc/doc.css">
  <link rel="stylesheet" href="/library.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="topbar">
    <button id="toggle-left" class="top-icon icon-button" data-icon="panel" aria-label="Hide slides" title="Hide slides (⌘/Ctrl+Shift+\)"></button>
    <nav class="crumbs" aria-label="Breadcrumb"><button id="open-library" class="crumb-link" title="Library (⌘/Ctrl+O)">Library</button><span class="crumb-sep" aria-hidden="true">/</span><div class="deck-menu"><button id="deck-title" class="crumb-title" aria-label="Project menu" aria-haspopup="true" aria-expanded="false"><span id="deck-title-label">Untitled</span><span data-icon="chevron"></span></button><div id="deck-menu" class="popover" hidden><button id="rename-deck">Rename</button><button id="new-deck">New deck</button><button id="new-doc">New doc</button><button id="open-deck">Open…</button><button id="save-copy">Save a copy…</button></div></div><span id="status-dot" class="status-dot" role="img" aria-label="Saved"></span><span id="slide-label" class="crumb-detail">Your canvas</span></nav>
    <span class="spacer"></span>
    <button id="toggle-comments" class="top-icon with-count" data-icon="comment" aria-label="Comments" title="Comments" aria-pressed="false"><span id="comment-count" class="count">0</span></button>
    <button id="toggle-history" class="top-icon wide-only" data-icon="history" aria-label="Version history" title="Version history" aria-pressed="false"></button>
    <button id="deck-design" class="top-icon wide-only" data-icon="design" aria-label="Design" title="Design" aria-pressed="false"></button>
    <button id="present" class="top-icon" data-icon="play" aria-label="Present" title="Present (F5)"></button>
    <div class="export-menu"><button id="export" class="top-icon" data-icon="export" aria-label="Export" title="Export" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu"></button><div id="export-menu" class="popover" role="menu" aria-label="Export format" hidden><button role="menuitem" tabindex="-1" data-format="pptx">PowerPoint (.pptx)</button><button role="menuitem" tabindex="-1" data-format="pdf">PDF</button><button role="menuitem" tabindex="-1" data-format="png">PNG images (.zip)</button><button role="menuitem" tabindex="-1" data-format="html">HTML presentation</button><button role="menuitem" tabindex="-1" data-format="json">Deck JSON</button><button role="menuitemcheckbox" tabindex="-1" id="export-template" aria-checked="false">Into template</button><button role="menuitemcheckbox" tabindex="-1" id="export-quick" aria-checked="false">Save to exports/ without asking</button></div></div>
    <div class="more-menu"><button id="more" class="top-icon" data-icon="more" aria-label="More" title="More" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu"></button><div id="more-menu" class="popover" role="menu" aria-label="More" hidden><button id="undo" role="menuitem" tabindex="-1">Undo<kbd>⌘Z</kbd></button><button id="redo" role="menuitem" tabindex="-1">Redo<kbd>⇧⌘Z</kbd></button><button id="play-from-here" role="menuitem" tabindex="-1">Play from this slide<kbd>⇧↵</kbd></button><button id="more-history" class="narrow-only" role="menuitem" tabindex="-1">Version history</button><button id="more-design" class="narrow-only" role="menuitem" tabindex="-1">Design</button><button id="more-properties" role="menuitem" tabindex="-1">Properties<kbd>⌘\</kbd></button></div></div>
  </header>
  <main>
    <section id="workspace">
      <aside id="strip-pane"><div id="slides-pane"><div class="rail-heading">Slides</div><div id="strip"></div><button id="add-slide" class="add-slide" data-icon="plus" title="Add a slide" aria-label="Add a slide"></button><div id="layout-menu" class="popover" hidden><div class="eyebrow">Start with a layout</div><div id="layout-options"></div></div></div><div class="layers-heading"><span data-icon="layers"></span>Layers</div><div id="layers" class="layers-tree" role="tree" aria-label="Layers"></div><div id="deck-status" class="deck-status" role="status"><span id="save" class="status-line save" title="Every change is saved to the deck file as you make it"><span id="dirty">Opening…</span></span><span id="link-status" class="status-line link">Not linked</span></div></aside>
      <section id="canvas-space">
        
        <div id="preview-bar" hidden><span class="preview-dot"></span><strong>Suggested edit</strong><button id="preview-toggle">After · B for before</button><span class="spacer"></span><button id="preview-apply" class="primary">Apply edit</button><button id="close-preview" class="icon-button" data-icon="x" aria-label="Close preview"></button></div>
        <div id="stage"><div id="slide-wrap"><div id="canvas" class="slide" tabindex="0" aria-label="Slide canvas"></div><div id="pins"></div><div id="build-badges"></div></div><div id="floating-toolbar" role="toolbar" aria-label="Selection formatting" hidden></div><div id="canvas-empty" hidden><h2>A blank canvas. A fresh start.</h2><p>Add a slide to begin your story.</p><button id="empty-add" data-icon="plus">Add slide</button></div></div>
        <div id="canvas-bottom"><details id="notes"><summary>Speaker notes</summary><textarea id="speaker-notes" aria-label="Speaker notes" placeholder="What would you like to say about this slide?"></textarea></details><div class="tool-pill" role="toolbar" aria-label="Tools"><button id="edit-mode" data-icon="cursor" aria-pressed="true" aria-label="Select" title="Select (V)"></button><button id="add-text" data-icon="text" aria-label="Add text" title="Text"></button><button id="add-shape" data-icon="shape" aria-label="Add shape" title="Shape"></button><button id="add-image" data-icon="image" aria-label="Add image" title="Image (or paste one)"></button><span class="tool-sep" aria-hidden="true"></span><button id="comment-mode" data-icon="comment" aria-pressed="false" aria-label="Comment" title="Comment (C)"></button></div><div class="canvas-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" title="Fit (⌘/Ctrl+0)">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
        <div id="thread-popover" class="thread-popover" hidden></div><div id="status" role="status" hidden></div>
      </section>
      <aside id="sidebar" aria-label="Sidebar" hidden><div class="side-tabs" role="tablist"><button id="side-tab-properties" class="side-tab" role="tab" data-side="properties">Properties</button><button id="side-tab-comments" class="side-tab" role="tab" data-side="comments">Comments <span id="side-comment-count" class="tab-count"></span></button><button id="side-tab-history" class="side-tab" role="tab" data-side="history">History</button><button id="side-tab-design" class="side-tab" role="tab" data-side="design">Design</button><span class="spacer"></span><button id="close-side" class="icon-button" data-icon="x" aria-label="Close sidebar" title="Close sidebar"></button></div><section id="properties-panel" class="side-pane" role="tabpanel" aria-labelledby="side-tab-properties" hidden><div class="side-heading"><div class="panel-tabs" role="tablist" aria-label="Properties"><button id="tab-design" role="tab" aria-selected="true">Style</button><button id="tab-animate" role="tab" aria-selected="false">Animate</button></div></div><div id="properties"></div></section><section id="comments-panel" class="side-pane" role="tabpanel" aria-labelledby="side-tab-comments" hidden><span id="review-count" hidden></span><div class="comment-filters"><button id="filter-open" aria-pressed="true">Open</button><button id="filter-resolved" aria-pressed="false">Resolved</button></div><label class="resolved-toggle"><input id="show-resolved" type="checkbox"> Show resolved pins</label><div id="comments-list"></div></section><section id="history-pane" class="side-pane" role="tabpanel" aria-labelledby="side-tab-history" hidden></section><section id="design-pane" class="side-pane" role="tabpanel" aria-labelledby="side-tab-design" hidden><div id="deck-design-info" class="design-current"></div><div class="side-eyebrow">Switch design</div><div id="deck-design-list" class="design-list"></div><button id="add-template" class="side-action" data-icon="plus">Add template…</button></section></aside>
    </section>
  </main>
  <div id="library" hidden></div>
  <dialog id="path-dialog"><form method="dialog"><h2 id="path-heading">Open deck</h2><label id="path-label" for="path-input">Path</label><input id="path-input" required autocomplete="off"><p id="path-hint"></p><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button id="path-confirm" class="primary" value="ok">Open</button></div></form></dialog>
  <dialog id="export-details" aria-labelledby="export-details-heading"><h2 id="export-details-heading">Export approximations</h2><ul id="export-warnings"></ul><form method="dialog"><div class="dialog-actions"><button value="close">Close</button></div></form></dialog>
  <div id="doc-app" hidden></div>
  <div id="presentation" hidden><div id="present-stage"></div><aside id="presenter"><div class="presenter-label">Next step</div><div id="present-next"></div><div class="presenter-label">Speaker notes</div><div id="present-notes"></div><div id="present-timer">00:00</div></aside><span id="present-counter"></span><span id="present-jump"></span><span id="present-step"></span><button id="presenter-toggle">Presenter · P</button><button id="exit-present">Exit · Esc</button></div>
</body>
</html>

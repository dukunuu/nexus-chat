[package]
# `nexus-core` on crates.io belongs to another project (SparkAIUR/nexus),
# so the published package is `nexus-chat-core`. The lib target keeps the
# `nexus_core` name, so every `use nexus_core::…` in both crates is stable.
name = "nexus-chat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "nexus_core"

[features]
# Compiles test-only helpers (in-memory Db) for downstream test code.
# Enabled from the TUI crate's dev-dependencies only.
test-helpers = []

[dev-dependencies]
# Core's own tests use the same `test-helpers` (event-drain assertions on
# `App::last_status`/`drain_composer_sets`).
nexus-chat-core = { path = ".", features = ["test-helpers"] }

[dependencies]
# ── Core deps ─────────────────────────────────────────────────────────────
anyhow = { workspace = true }
arboard = { workspace = true }  # device-code login copies the URL to the OS clipboard (config.rs)
base64 = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
open = { workspace = true }
pdf-extract = { workspace = true }
png = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[package]
# `nexus-core` on crates.io belongs to another project (SparkAIUR/nexus),
# so the published package is `nexus-chat-core`. The lib target keeps the
# `nexus_core` name, so every `use nexus_core::…` in both crates is stable.
name = "nexus-chat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "nexus_core"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dependencies]
# ── Core deps ─────────────────────────────────────────────────────────────
anyhow = { workspace = true }
arboard = { workspace = true }  # device-code login copies the URL to the OS clipboard (config.rs)
base64 = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
ignore = { workspace = true }
keyring = { workspace = true }  # connector secrets: OS keychain (connectors/secrets.rs)
krilla = { workspace = true }  # vector PDF export for docs and decks (doc/export/pdf.rs)
krilla-svg = { workspace = true }
open = { workspace = true }
pdf-extract = { workspace = true }
png = { workspace = true }
pulldown-cmark = { workspace = true }
rand = { workspace = true }
resvg = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
taffy = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

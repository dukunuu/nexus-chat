# cargo-audit config. Only ignore advisories that are provably unreachable:
#
# RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml <0.41 DoS):
#   quick-xml arrives via two paths, neither feeds untrusted XML:
#   1. wayland-scanner (build-time proc-macro) parses wayland protocol XML
#      bundled and trusted with the crate.
#   2. plist (syntect's default features, used by tui-markdown) parses
#      .tmTheme files — this app loads themes from alacritty.toml only, so
#      the plist path is compiled but never exercised.
#   Both upstreams still pin 0.39; there is no compatible upgrade.
#
# RUSTSEC-2026-0367 / RUSTSEC-2026-0368 / RUSTSEC-2026-0369 (zip <9.0.0):
#   all three are in ZipArchive::extract / ZipStreamReader::extract (SUID bits,
#   symlink targets, permissions through symlinks on extraction to disk). No
#   code calls either: archives are only written, or read entry by entry into
#   memory (sync.rs, extract.rs, cli.rs, host/browser_sync.rs). The fix (zip 9)
#   changes ZipFile::name() to return a Result, which needs an edit in host code
#   that is out of scope right now. Drop these when zip is upgraded, and never
#   add an extract() call before then.
#
# Unmaintained warnings (bincode/ttf-parser/yaml-rust, and smartstring via
# rhai for scripted terminal apps) are informational —
# transitive, no known vulnerability, no maintained replacement upstream.
[advisories]
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

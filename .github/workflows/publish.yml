name: Publish

# Push a tag like v0.1.1 to publish the crate and cut a GitHub release.
# The Cargo.toml version must match the tag (without the leading v).
# Master pushes are released automatically by version-bump.yml — no manual
# tag needed for those.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    secrets: inherit

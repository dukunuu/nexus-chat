[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/studio"]

[workspace.package]
version = "0.1.40"
edition = "2024"
rust-version = "1.91"
description = "A local-first terminal chat app for deep research and multi-agent work"
license = "MIT"
repository = "https://github.com/dukunuu/nexus-chat"
keywords = ["chat", "research", "tui", "ratatui", "llm"]
categories = ["command-line-utilities", "multimedia::images"]

[workspace.dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.32"
open = "5.3.6"
pdf-extract = "0.12.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ignore = "=0.4.33"
png = "0.18.1"
pulldown-cmark = { version = "0.13", default-features = false }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
qrcode = "0.14.1"
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
reqwest-eventsource = "0.6.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tao = "0.37.1"
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-width"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
toml = "1.1.2"
tui-markdown = "0.3.8"
tui-textarea-2 = "0.12.0"
unicode-width = "0.2.2"
uuid = { version = "1.23.4", features = ["v4"] }
wry = "0.57.0"
# Every default feature except zstd: Office packages and our exports only use
# deflate, and zip 8's zstd 0.13 carries RUSTSEC-2026-0391/0398/0403/0410.
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "ppmd", "time", "xz"] }

# Development and test builds keep file:line backtraces but not full debug
# info: full DWARF made the target dir several GB per build (most of it
# debug info), and dependencies are rarely stepped through. Release is
# unaffected. For a debugger session, override with
# CARGO_PROFILE_DEV_DEBUG=full (and CARGO_PROFILE_DEV_PACKAGE_..._DEBUG).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace]
resolver = "2"
members = ["crates/core", "crates/tui"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
description = "A local-first terminal chat app for deep research and multi-agent work"
license = "MIT"
repository = "https://github.com/dukunuu/nexus-chat"
keywords = ["chat", "research", "tui", "ratatui", "llm"]
categories = ["command-line-utilities", "multimedia::images"]

[workspace.dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.32"
open = "5.3.6"
pdf-extract = "0.12.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18.1"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
reqwest-eventsource = "0.6.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-width"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "1.1.2"
tui-markdown = "0.3.8"
tui-textarea-2 = "0.12.0"
unicode-width = "0.2.2"
uuid = { version = "1.23.4", features = ["v4"] }
zip = "8.6.0"
